# PostgreSQL solo para desarrollo local. La contraseña no sirve en Neon ni en Render.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_capilar
    ports:
      - "5432:5432"
    volumes:
      - studio_capilar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio_capilar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studio_capilar_pg:
